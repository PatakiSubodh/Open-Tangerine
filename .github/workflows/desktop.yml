name: Windows and Linux desktop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt and media dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libxcb-xkb1 libxcb-shm0 xvfb xauth ffmpeg
      - name: Windows media test dependency
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install pinned desktop dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt pyinstaller==6.22.3
      - name: Conversion, safety and UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Package portable app with source and licenses
        run: python package.py
      - name: Verify archived package
        run: python verify_package.py
      - name: Packaged smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python smoke_package.py
      - name: Packaged Linux X11 window
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a python smoke_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            Desktop/dist/Open-Tangerine-*.zip
            Desktop/dist/Open-Tangerine-*.tar.gz
            Desktop/dist/Open-Tangerine-*.sha256
          if-no-files-found: error
  publish:
    needs: desktop
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Publish only after both platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import sys;sys.path.insert(0,'Desktop');from engine import VERSION;print(VERSION)")
          cd release-assets
          sha256sum -c *.sha256
          cd ..
          if gh release view "desktop-v$VERSION" >/dev/null 2>&1; then
            echo 'Version already exists; never replace published binaries silently.'
            exit 0
          fi
          gh release create "desktop-v$VERSION" release-assets/* --target "$GITHUB_SHA" --prerelease --title "Windows and Linux $VERSION · Early desktop trial" --notes-file Desktop/RELEASE.md
