name: macOS build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      BUILD_UNIVERSAL: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install media test dependency
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Website checks
        run: |
          node scripts/test-site.cjs
          node scripts/test-desktop-site.cjs
          node scripts/test-demo.cjs
          node scripts/test-analytics.cjs
      - name: Test
        run: ./scripts/test.sh
      - name: Build
        run: ./scripts/build-app.sh
      - name: Package trial
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Open Tangerine.app" dist/Open-Tangerine-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Open-Tangerine-${{ matrix.os }}
          path: dist/Open-Tangerine-macOS.zip
